[project]
name = "news"
version = "0.1.0"
description = "Frame — multilingual cinema newsroom and RSS aggregator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "feedparser>=6.0,<7",
  "trafilatura>=2.0,<3",
  "rapidfuzz>=3.12,<4",
  "apscheduler>=3.11,<4",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20",
  "langdetect>=1.0.9",
  "python-slugify>=8.0,<9",
  "beautifulsoup4>=4.13,<5",
  "nh3>=0.3,<1",
  "html5lib>=1.1,<2",
]
[project.optional-dependencies]
translation = ["argostranslate>=1.9,<2", "torch>=2.6"]
semantic = ["sentence-transformers>=3,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "ruff>=0.11", "playwright>=1.50"]
[project.scripts]
news = "app.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
